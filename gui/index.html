<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>墨溯 · 本地微信数据</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/assets/theme.css" />
  <link rel="stylesheet" href="/assets/app.css" />
  <script src="/vendor/vue.global.prod.js"></script>
  <style>
    /* 首屏骨架：Vue 挂载前先给点东西，避免白屏 */
    #boot {
      position: fixed; inset: 0; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #64748b; background: #f4f6f9; z-index: 999;
      transition: opacity .2s ease;
    }
    [data-theme="dark"] #boot { background: #0d1117; color: #8b96a5; }
    #boot .mark {
      width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 12px;
      background: linear-gradient(140deg, #2f6feb, #7aa2ff);
      display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 20px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot">
    <div style="text-align:center">
      <div class="mark">墨</div>
      <div>墨溯启动中…</div>
    </div>
  </div>

  <!-- 加载顺序 = 依赖顺序：内核 → 页面组件 → 外壳（外壳最后挂载） -->
  <script src="/assets/core.js"></script>
  <script src="/assets/icons.js"></script>
  <script src="/assets/lightbox.js"></script>
  <script src="/assets/views-insight.js"></script>
  <script src="/assets/views-browse.js"></script>
  <script src="/assets/views-data.js"></script>
  <script src="/assets/views-console.js"></script>
  <script src="/assets/views-setup.js"></script>
  <script src="/assets/app.js"></script>
  <script>
    // Vue 挂载后移除首屏骨架；若脚本加载失败，骨架上直接显示原因
    window.addEventListener("error", function (e) {
      var b = document.getElementById("boot");
      if (b && !document.querySelector(".app")) {
        b.innerHTML = '<div style="text-align:center;max-width:520px;padding:24px">'
          + '<div class="mark" style="background:#dc2626">!</div>'
          + '<div style="font-weight:600;color:#0f172a;margin-bottom:6px">界面加载失败</div>'
          + '<div style="font-size:13px">' + (e.message || "未知错误") + '</div>'
          + '<div style="font-size:12px;margin-top:8px">确认服务是从项目目录启动的（资源在 gui/assets/）</div>'
          + '</div>';
      }
    });
    var t = setInterval(function () {
      if (document.querySelector(".app")) {
        var b = document.getElementById("boot");
        if (b) { b.style.opacity = "0"; setTimeout(function () { b.remove(); }, 200); }
        clearInterval(t);
      }
    }, 60);
  </script>
</body>
</html>
