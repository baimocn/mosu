<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨溯控制台</title>
<script src="/vendor/vue.global.prod.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #app { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #ededed; color: #1a1a1a; font-size: 14px;
  }
  #app { display: flex; flex-direction: column; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border-bottom: 1px solid #e0e0e0;
    padding: 0 16px; height: 52px; flex-shrink: 0;
  }
  .logo { font-size: 17px; font-weight: 700; color: #07c160; letter-spacing: .5px; }
  .logo small { font-weight: 400; color: #999; font-size: 12px; margin-left: 6px; }
  .badges { margin-left: auto; display: flex; gap: 8px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: #555; background: #f5f5f5;
    border: 1px solid #e8e8e8; border-radius: 20px; padding: 4px 12px;
    white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c0c0c0; flex-shrink: 0; }
  .dot.on { background: #07c160; box-shadow: 0 0 0 3px rgba(7,193,96,.15); }
  .dot.off { background: #d9d9d9; }
  .dot.err { background: #fa5151; box-shadow: 0 0 0 3px rgba(250,81,81,.15); }

  /* ---------- 主区 ---------- */
  .main { flex: 1; display: flex; min-height: 0; }
  .chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .side-col {
    width: 340px; flex-shrink: 0; border-left: 1px solid #e0e0e0;
    background: #f7f7f7; display: flex; flex-direction: column; min-height: 0;
  }
  @media (max-width: 900px) { .side-col { display: none; } }

  /* ---------- 对话 ---------- */
  .chat-scroll { flex: 1; overflow-y: auto; padding: 16px 16px 8px; }
  .sys-tip {
    text-align: center; color: #999; font-size: 12px; margin: 8px 0 16px;
  }
  .sys-tip span { background: rgba(0,0,0,.06); border-radius: 4px; padding: 3px 10px; }
  .msg-row { display: flex; margin-bottom: 14px; }
  .msg-row.me { justify-content: flex-end; }
  .bubble {
    max-width: 62%; padding: 9px 12px; border-radius: 8px;
    line-height: 1.55; word-break: break-word; white-space: pre-wrap;
    position: relative;
  }
  .msg-row.bot .bubble { background: #fff; border-top-left-radius: 2px; }
  .msg-row.me .bubble { background: #95ec69; border-top-right-radius: 2px; }
  .msg-meta {
    font-size: 11px; color: #aaa; margin-top: 4px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .msg-row.me .msg-meta { justify-content: flex-end; }
  .tag-ok { color: #07c160; }
  .tag-bad { color: #fa5151; }
  .refs { margin-top: 6px; }
  .refs summary {
    font-size: 11px; color: #888; cursor: pointer; user-select: none;
    list-style: none;
  }
  .refs summary::-webkit-details-marker { display: none; }
  .refs summary::before { content: "▸ "; }
  .refs[open] summary::before { content: "▾ "; }
  .refs ul { margin: 6px 0 0 14px; }
  .refs li {
    font-size: 12px; color: #666; margin-bottom: 3px; line-height: 1.5;
  }
  .refs .from { color: #07c160; margin-right: 4px; }

  .typing {
    display: inline-flex; align-items: center; gap: 4px;
    color: #999; font-size: 12px; margin-bottom: 14px; padding-left: 4px;
  }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%; background: #bbb;
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* ---------- 输入区 ---------- */
  .input-bar {
    display: flex; gap: 10px; padding: 10px 16px 14px;
    background: #f7f7f7; border-top: 1px solid #e8e8e8; flex-shrink: 0;
  }
  .input-bar textarea {
    flex: 1; resize: none; border: none; outline: none;
    background: #fff; border-radius: 8px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; line-height: 1.5; height: 46px;
  }
  .send-btn {
    border: none; background: #07c160; color: #fff;
    border-radius: 8px; padding: 0 22px; font-size: 14px; cursor: pointer;
    transition: opacity .15s;
  }
  .send-btn:disabled { opacity: .45; cursor: not-allowed; }
  .send-btn:not(:disabled):hover { background: #06ad56; }

  /* ---------- 侧栏 ---------- */
  .panel { border-bottom: 1px solid #e8e8e8; display: flex; flex-direction: column; min-height: 0; }
  .panel:last-child { border-bottom: none; }
  .panel-log { flex: 1; min-height: 0; }
  .panel-title {
    font-size: 13px; font-weight: 600; color: #444;
    padding: 12px 14px 8px; display: flex; align-items: center; gap: 6px;
  }
  .panel-title .count { font-weight: 400; color: #aaa; font-size: 11px; }
  .log-scroll { overflow-y: auto; padding: 0 14px 12px; flex: 1; }
  .log-item {
    display: flex; gap: 8px; font-size: 12px; line-height: 1.5;
    padding: 4px 0; border-bottom: 1px dashed #eee;
  }
  .log-item:last-child { border-bottom: none; }
  .log-time { color: #bbb; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .log-text { color: #555; word-break: break-all; }
  .log-item.in .log-text { color: #07c160; }
  .log-item.err .log-text { color: #fa5151; }
  .log-empty { color: #bbb; font-size: 12px; text-align: center; padding: 18px 0; }
  .kv { padding: 0 14px 14px; }
  .kv-row {
    display: flex; justify-content: space-between; font-size: 12px;
    padding: 3px 0; gap: 8px;
  }
  .kv-row .k { color: #999; flex-shrink: 0; }
  .kv-row .v { color: #444; text-align: right; word-break: break-all; }
  .kv-row .v.ok { color: #07c160; }
  .kv-row .v.bad { color: #fa5151; }
</style>
</head>
<body>
<div id="app">
  <!-- 顶栏：品牌 + 状态徽章 -->
  <header class="topbar">
    <div class="logo">墨溯<small>mosu 控制台</small></div>
    <div class="badges">
      <span class="badge" :title="wechatTitle">
        <i class="dot" :class="wechatDot"></i>微信通道 {{ wechatLabel }}
      </span>
      <span class="badge" :title="'通道服务最近心跳：' + serviceTitle">
        <i class="dot" :class="serviceDot"></i>通道服务 {{ service.alive ? '运行中' : '未运行' }}
      </span>
      <span class="badge">
        <i class="dot on" v-if="status.bot"></i>语料 {{ status.bot ? status.bot.corpus.toLocaleString() : '-' }} 条
      </span>
    </div>
  </header>

  <div class="main">
    <!-- 对话列 -->
    <section class="chat-col">
      <div class="chat-scroll" ref="scrollBox">
        <p class="sys-tip"><span>墨溯控制台就绪 —— 随便发点什么，我用你的口气回你</span></p>
        <template v-for="(m, i) in messages" :key="i">
          <div class="msg-row" :class="m.role === 'me' ? 'me' : 'bot'">
            <div>
              <div class="bubble" v-text="m.text"></div>
              <div class="msg-meta" v-if="m.meta" v-text="m.meta"></div>
              <details class="refs" v-if="m.refs && m.refs.length">
                <summary>检索参考 {{ m.refs.length }} 条（只取风格，不照抄）</summary>
                <ul>
                  <li v-for="(r, j) in m.refs" :key="j">
                    <span class="from">[{{ r.session }}]</span>{{ r.text }}
                  </li>
                </ul>
              </details>
            </div>
          </div>
        </template>
        <div class="typing" v-if="sending">
          对方正在输入<i></i><i></i><i></i>
        </div>
      </div>
      <div class="input-bar">
        <textarea ref="inputBox" v-model="draft"
          placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"
          @keydown.enter.exact.prevent="send"></textarea>
        <button class="send-btn" :disabled="sending || !draft.trim()" @click="send">
          {{ sending ? '…' : '发送' }}
        </button>
      </div>
    </section>

    <!-- 侧栏：消息流水 + 状态详情 -->
    <aside class="side-col">
      <div class="panel panel-log">
        <div class="panel-title">
          微信消息流水<span class="count">{{ events.length }} 条</span>
        </div>
        <div class="log-scroll" ref="logBox">
          <p class="log-empty" v-if="!events.length">暂无记录</p>
          <div class="log-item" v-for="(e, i) in events" :key="i"
               :class="e.kind === '[收到]' ? 'in' : (e.kind === '[!]' ? 'err' : '')">
            <span class="log-time">{{ e.time.slice(6) }}</span>
            <span class="log-text">{{ e.text }}</span>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">状态详情</div>
        <div class="kv">
          <div class="kv-row">
            <span class="k">通道账号</span>
            <span class="v" v-text="wechat.account || '—'"></span>
          </div>
          <div class="kv-row">
            <span class="k">用户</span>
            <span class="v" v-text="wechat.user || '—'"></span>
          </div>
          <div class="kv-row">
            <span class="k">轮询游标</span>
            <span class="v" :class="wechat.cursor ? 'ok' : ''"
                  v-text="wechat.cursor ? '已建立' : '无'"></span>
          </div>
          <div class="kv-row">
            <span class="k">最近心跳</span>
            <span class="v" :class="service.alive ? 'ok' : 'bad'"
                  v-text="service.last_seen == null ? '从未' : service.last_seen + ' 秒前'"></span>
          </div>
          <div class="kv-row">
            <span class="k">LLM 后端</span>
            <span class="v" v-text="status.bot ? status.bot.model : '—'"></span>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>

<script>
const { createApp } = Vue;
createApp({
  data() {
    return {
      status: { wechat: {}, service: {}, bot: null },
      events: [],
      messages: [],
      draft: "",
      sending: false,
    };
  },
  computed: {
    wechat() { return this.status.wechat || {}; },
    service() { return this.status.service || {}; },
    wechatDot() {
      if (!this.wechat.logged_in) return "off";
      return this.service.alive ? "on" : "err";
    },
    wechatLabel() {
      if (!this.wechat.logged_in) return "未登录";
      return this.service.alive ? "在线" : "服务未运行";
    },
    wechatTitle() {
      return this.wechat.logged_in
        ? "已绑定账号 " + (this.wechat.account || "?")
        : "运行 mosu wechat login 扫码绑定";
    },
    serviceDot() { return this.service.alive ? "on" : "off"; },
    serviceTitle() {
      return this.service.last_seen == null ? "无心跳记录" : this.service.last_seen + " 秒前";
    },
  },
  mounted() {
    this.refreshStatus();
    this.refreshLog();
    this._t1 = setInterval(this.refreshStatus, 5000);
    this._t2 = setInterval(this.refreshLog, 3000);
  },
  unmounted() { clearInterval(this._t1); clearInterval(this._t2); },
  methods: {
    async refreshStatus() {
      try {
        const r = await fetch("/api/status");
        this.status = await r.json();
      } catch (e) { /* 网络抖动时静默，下次轮询恢复 */ }
    },
    async refreshLog() {
      try {
        const r = await fetch("/api/log?n=60");
        const d = await r.json();
        if (d.events) {
          const atBottom = this.$refs.logBox &&
            this.$refs.logBox.scrollTop + this.$refs.logBox.clientHeight
              >= this.$refs.logBox.scrollHeight - 30;
          this.events = d.events;
          if (atBottom) this.$nextTick(() => {
            const b = this.$refs.logBox;
            if (b) b.scrollTop = b.scrollHeight;
          });
        }
      } catch (e) { /* 同上 */ }
    },
    pushMsg(role, text, meta, refs) {
      this.messages.push({ role, text, meta, refs });
      this.$nextTick(() => {
        const b = this.$refs.scrollBox;
        if (b) b.scrollTop = b.scrollHeight;
      });
    },
    async send() {
      const q = this.draft.trim();
      if (!q || this.sending) return;
      this.draft = "";
      this.pushMsg("me", q);
      this.sending = true;
      const t0 = Date.now();
      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: q }),
        });
        const d = await r.json();
        if (d.error) {
          this.pushMsg("bot", "（出错了）" + d.error,
            ((Date.now() - t0) / 1000).toFixed(1) + "s");
        } else {
          const meta = [
            ((Date.now() - t0) / 1000).toFixed(1) + "s",
            d.tries + " 次尝试",
            d.passed ? "校验通过" : "校验未过",
          ].join(" · ");
          this.pushMsg("bot", d.reply || "（空回复）", meta, d.retrieved || []);
        }
      } catch (e) {
        this.pushMsg("bot", "（网络错误）" + e, ((Date.now() - t0) / 1000).toFixed(1) + "s");
      } finally {
        this.sending = false;
        this.$nextTick(() => this.$refs.inputBox && this.$refs.inputBox.focus());
      }
    },
  },
}).mount("#app");
</script>
</body>
</html>
