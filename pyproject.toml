[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosu"
version = "0.2.0"
description = "Local WeChat (PC) chat data decryption, browsing and export toolkit — from-scratch SQLCipher 4 engine, no DLL injection, no network"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "傅铭胜" }]
keywords = ["wechat", "sqlcipher", "decrypt", "export", "forensics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
# 必装依赖；jieba/Pillow 为可选（缺失时自动降级）
dependencies = [
    "pycryptodome>=3.19",
    "zstandard>=0.21",
]

[project.optional-dependencies]
full = ["jieba>=0.42.1", "Pillow>=10.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/baimocn/mosu"
Documentation = "https://github.com/baimocn/mosu/blob/main/README.md"
Changelog = "https://github.com/baimocn/mosu/blob/main/CHANGELOG.md"

[project.scripts]
mosu = "cli.mosu:main"

[tool.setuptools]
packages = ["core", "core.bot", "cli", "gui"]

[tool.setuptools.package-data]
gui = ["index.html", "vendor/*.js"]
